name: CI
on: 
  push:
    branches:
    - main
    - develop
  pull_request:
jobs: 
  test:
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout repository 
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies 
        run: uv sync

      - name: Run ruff 
        run: uv run ruff check .

      - name: Run tests 
        env:
          APP_ENV: test
          APP_SECRET_KEY: ci-test-secret
          USERS_DATABASE_URL: postgresql://test:test@localhost/test
        run: uv run pytest --cov=app --cov-report=term-missing 
